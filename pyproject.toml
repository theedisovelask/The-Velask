[project]
name = "velask-precall"
version = "0.1.0"
description = "VSK • PRE-CALL — esteira de proposta Velask antes da call"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
velask-precall = "scripts.run_pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "scripts*"]
